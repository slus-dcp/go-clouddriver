name: Checkmarx One Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cx_scan:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    uses: slus-dcp/gh-workflow-common/.github/workflows/checkmarx-one-v2.yml@main
    with:
      team: ${{ vars.TEAM }}
    secrets:
      cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
      repo_token: ${{ secrets.GITHUB_TOKEN }}
      cx_tenant: ${{ secrets.CX_TENANT }}
      cx_base_uri: ${{ secrets.CX_BASE_URI }}
      cx_client_id: ${{ secrets.CX_OAUTH_CLIENT_ID }}
